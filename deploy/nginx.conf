server {
    listen 80;
    listen [::]:80;
    server_name 54.226.16.169.sslip.io _;

    root /home/ec2-user/OviUs/client/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 54.226.16.169.sslip.io;

    ssl_certificate /etc/letsencrypt/live/54.226.16.169.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/54.226.16.169.sslip.io/privkey.pem;

    root /home/ec2-user/OviUs/client/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
